<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | DarkKernel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070b;
            color: #e6edf3;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .code {
            font-size: clamp(6rem, 25vw, 13rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.08em;

            background: linear-gradient(
                90deg,
                #ff1493,
                #ff7a00,
                #ffe600,
                #20e64b,
                #00e5ff,
                #2878ff,
                #a855f7,
                #ff1493
            );

            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: rainbow 5s linear infinite;
        }

        @keyframes rainbow {
            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        h1 {
            font-size: clamp(1.8rem, 6vw, 3rem);
            margin: 20px 0 12px;
        }

        p {
            color: #8b949e;
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            background: linear-gradient(135deg, #6d5dfc, #e83e8c);
            transition: transform 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px);
        }

        .terminal {
            margin-top: 35px;
            color: #586069;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .terminal span {
            color: #00e5ff;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist.
        </p>

        <a href="/">← Back to DarkKernel</a>

        <div class="terminal">
            <span>darkkernel@linux:~$</span> cd /
        </div>

    </main>

</body>
</html>
